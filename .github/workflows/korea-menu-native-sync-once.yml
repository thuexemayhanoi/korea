name: Korea native navigation one-time rebuild
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/korea-menu-native-sync-once.yml'
permissions:
  contents: write
concurrency:
  group: korea-native-navigation-once
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prevent stale checkout
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Regenerate Korean site and local search index
        run: |
          node tools/factory.mjs verify
          node tools/build.mjs
          node tools/build-chat-index.mjs
      - name: Quality checks including 300 pages and menu structure
        run: |
          node tools/build.mjs --check
          node tools/build-chat-index.mjs --check
          node tools/qa.mjs
      - name: Commit generated artifacts (fast-forward only)
        shell: bash
        run: |
          set -euo pipefail
          git add -u
          if git diff --cached --quiet; then
            echo "Static navigation already up to date."
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main changed during generation. Refusing stale commit."
            exit 1
          fi
          git config user.name "korea-native-menu[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(korea): publish seven-link native menu across 379 indexable URLs"
          git push origin HEAD:main
