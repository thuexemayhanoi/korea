name: Korea Site Quality (QA only)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate AI draft writer syntax and unit tests (no API calls)
        run: |
          node --check tools/auto-writer.mjs
          node --test tools/auto-writer.test.mjs
      - name: Validate the external writer factory matrix and queue
        run: node tools/factory.mjs verify
      - name: Verify generated pages are in sync
        run: node tools/build.mjs --check
      - name: Validate Korean SEO and internal links
        run: node tools/qa.mjs
      - name: Validate local Korean HTML chat index
        run: node tools/build-chat-index.mjs --check
