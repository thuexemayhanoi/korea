name: Korea AI Search Optimizer build
on:
  push:
    branches: [main]
    paths:
      - 'tools/build.mjs'
      - 'tools/lib/editorial.mjs'
      - 'data/faqs.json'
      - '.github/workflows/ai-search-optimizer.yml'
permissions:
  contents: write
concurrency:
  group: korea-ai-search-optimizer
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate all pages with shared FAQ and schema
        run: |
          node tools/factory.mjs verify
          node tools/build.mjs
          node tools/build-chat-index.mjs
          node tools/qa.mjs
          node tools/build.mjs --check
          node tools/build-chat-index.mjs --check
      - name: Publish generated pages only when main has not changed
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "All generated pages already match the source"
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Main advanced; refusing to overwrite concurrent edits"
            exit 1
          fi
          git config user.name "korea-ai-search[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(korea): regenerate AEO/GEO FAQ entity schema and 300 articles"
          git push origin HEAD:main
